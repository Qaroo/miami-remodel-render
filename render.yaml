services:
  - type: web
    name: miami-remodel-lead-desk
    runtime: node
    plan: free
    region: virginia
    buildCommand: tar -xzf server-source.tar.gz && npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: miamiremodel
      - key: MOCK_MODE
        value: '0'
      - key: TWILIO_SKIP_SIGNATURE
        value: '0'
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTOMATION_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
